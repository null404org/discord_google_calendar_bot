# All hooks run in Docker — no local Python toolchain required beyond pre-commit itself.
#
# First-time setup:
#   1. pip install pre-commit
#   2. Build local images:
#        docker build -t local/detect-secrets:latest .docker/detect-secrets/
#        docker build -t local/bandit:latest .docker/bandit/
#   3. Generate the secrets baseline (--all-files bypasses git discovery):
#        docker run --rm -v "$(pwd):$(pwd)" -w "$(pwd)" local/detect-secrets:latest scan --all-files > .secrets.baseline
#        git add .secrets.baseline
#   4. pre-commit install
#
# Run manually: pre-commit run --all-files

default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # TruffleHog — verified secret detection
  # Uses filesystem mode (not git mode) so it works inside Docker where the
  # worktree .git pointer cannot be resolved. --no-update suppresses the
  # self-updater which fails on a read-only container filesystem.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        language: docker_image
        entry: trufflesecurity/trufflehog:latest filesystem . --only-verified --fail --no-update
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Trivy — filesystem vulnerability scan (HIGH and CRITICAL severity only)
  # Scans requirements.txt for known CVEs and checks for secrets/misconfigs.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: trivy
        name: Trivy
        language: docker_image
        entry: aquasec/trivy:latest filesystem --cache-dir /tmp/trivy-cache --exit-code 1 --severity HIGH,CRITICAL --no-progress .
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # detect-secrets — baseline-driven secret scanning
  # Uses detect-secrets-hook (not detect-secrets scan) so staged files are
  # checked against the baseline without modifying it. To update the baseline
  # after a legitimate secret is added, run:
  #   docker run --rm -v "$(pwd):$(pwd)" -w "$(pwd)" \
  #     --entrypoint detect-secrets local/detect-secrets:latest \
  #     scan --all-files > .secrets.baseline
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        language: docker_image
        entry: local/detect-secrets:latest --baseline .secrets.baseline # pragma: allowlist secret
        pass_filenames: true

  # ---------------------------------------------------------------------------
  # ruff format — black-compatible Python formatter
  # Image entrypoint is `ruff`, so `entry` provides subcommand + args only.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: docker_image
        entry: ghcr.io/astral-sh/ruff:latest format
        types_or: [python, pyi]

  # ---------------------------------------------------------------------------
  # ruff check — Python linter with autofix
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: docker_image
        entry: ghcr.io/astral-sh/ruff:latest check --fix
        types_or: [python, pyi]

  # ---------------------------------------------------------------------------
  # bandit — Python security static analysis
  # Uses a local image (built from .docker/bandit/Dockerfile) with a known
  # ENTRYPOINT ["bandit"] so args are unambiguous.
  # Scans only the application file; test file excluded (mock secrets cause
  # false positives on B105/B106/B107). Config read from pyproject.toml.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        language: docker_image
        entry: local/bandit:latest -c pyproject.toml discord_google_calendar_bot.py
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # pytest — run the full test suite before committing
  # Runs via uv so it uses the project's managed virtual environment.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest
        pass_filenames: false
        always_run: true
