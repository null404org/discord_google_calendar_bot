[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "A", "C4"]
ignore = [
  # S105/S106/S107: hardcoded passwords — false positives on mock values in tests
  "S105", "S106", "S107",
  # B904: raise-without-from-inside-except — not enforced in this codebase
  "B904",
]

[tool.ruff.lint.per-file-ignores]
"test_discord_google_calendar_bot.py" = ["S101", "S105", "S106", "S107", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.bandit]
exclude_dirs = [".venv", "__pycache__", "tests"]
skips = ["B101"]
